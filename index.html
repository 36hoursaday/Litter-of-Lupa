<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Pack of Lupa — 17th Century Chronicles</title>
<style>
  :root {
    --bg-dark: #0e0e12;
    --card-bg: #181920;
    --card-border: #282a36;
    --accent-red: #c0392b;
    --accent-red-bright: #e74c3c;
    --accent-gold: #d4af37;
    --accent-gold-bright: #f1c40f;
    --accent-purple: #8e44ad;
    --accent-purple-bright: #9b59b6;
    --text-primary: #f5f6fa;
    --text-secondary: #95a5a6;
    --text-dim: #636e72;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px; padding-bottom: 70px;
    background: var(--bg-dark); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.45;
  }
  .card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 14px; margin-bottom: 12px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
  }
  .roller-container { text-align: center; }
  .dice-display {
    font-size: 3.4rem; font-weight: 800; color: var(--accent-gold-bright);
    line-height: 1.1; margin: 4px 0 2px 0; text-shadow: 0 2px 10px rgba(241, 196, 15, 0.3);
  }
  .dice-subtext {
    font-size: 0.85rem; color: var(--text-secondary); min-height: 20px;
    margin-bottom: 10px; font-weight: 500;
  }
  .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
  button, .btn {
    background: #23272e; color: #fff; border: 1px solid #3e4451;
    border-radius: 8px; padding: 12px 10px; font-weight: 700; font-size: 0.95rem;
    flex: 1; cursor: pointer; text-align: center; transition: all 0.1s ease;
    touch-action: manipulation;
  }
  button:active, .btn:active { transform: scale(0.96); filter: brightness(1.2); }
  .btn-primary { background: var(--accent-red); border-color: var(--accent-red-bright); }
  .btn-gold { background: #5c470b; border-color: var(--accent-gold); color: #fff; }
  .btn-purple { background: #4a235a; border-color: var(--accent-purple-bright); color: #fff; }
  
  .mod-strip {
    display: flex; gap: 6px; background: #121318; padding: 6px;
    border-radius: 8px; margin-top: 8px; border: 1px solid #22242d;
  }
  .mod-btn {
    flex: 1; padding: 8px 2px; font-size: 0.78rem; font-weight: 600;
    background: #1e2028; border: 1px solid #333644; border-radius: 6px;
    color: var(--text-secondary); text-align: center; cursor: pointer;
  }
  .mod-btn.selected {
    background: var(--accent-gold); color: #000; border-color: var(--accent-gold-bright);
  }
  .nav-tabs {
    display: flex; background: #14151b; border-radius: 10px;
    padding: 3px; margin-bottom: 12px; border: 1px solid #252834;
  }
  .tab-btn {
    flex: 1; padding: 10px 4px; text-align: center; font-size: 0.82rem;
    font-weight: 600; color: var(--text-secondary); border-radius: 8px;
    cursor: pointer; border: none; background: transparent;
  }
  .tab-btn.active {
    background: var(--card-bg); color: var(--accent-gold-bright);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  
  .char-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .char-select {
    background: #252834; color: #fff; border: 1px solid #3e4451;
    font-size: 1rem; font-weight: 700; padding: 8px 10px; border-radius: 8px;
  }
  .level-badge {
    background: #2a2208; border: 1px solid var(--accent-gold);
    color: var(--accent-gold-bright); font-size: 0.8rem; font-weight: 700;
    padding: 8px 12px; border-radius: 6px; cursor: pointer;
  }
  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    margin: 10px 0; background: #111217; padding: 8px; border-radius: 8px;
  }
  .stat-col { text-align: center; }
  .stat-val { font-size: 1.25rem; font-weight: 800; color: var(--accent-gold); }
  .stat-lbl { font-size: 0.72rem; color: var(--text-secondary); text-transform: uppercase; }
  
  .tracker-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid #22242d;
  }
  .tracker-row:last-child { border-bottom: none; }
  .token-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .heart-token, .beast-token {
    width: 44px; height: 44px; border-radius: 8px; display: flex;
    align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer;
    border: 1px solid #444; background: #222;
  }
  .heart-token.lost, .beast-token.spent {
    opacity: 0.25; filter: grayscale(1);
  }
  
  .power-item {
    background: #14151b; border: 1px solid #282a36; border-radius: 8px;
    padding: 10px; margin-bottom: 8px; font-size: 0.88rem;
  }
  .power-title {
    font-weight: 700; color: var(--accent-gold); display: flex;
    justify-content: space-between; align-items: center; margin-bottom: 4px;
  }
  .inventory-input-wrap { display: flex; gap: 6px; margin: 10px 0; }
  .text-input {
    flex: 1; background: #121318; border: 1px solid #333644;
    color: #fff; padding: 10px; border-radius: 6px; font-size: 0.95rem;
  }
  .item-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .item-tag {
    background: #252834; padding: 6px 10px; border-radius: 6px;
    font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
    border: 1px solid #3a3f50;
  }
  
  .dossier-section {
    background: #121318; border: 1px solid #22242d; border-radius: 8px;
    padding: 12px; margin-bottom: 10px;
  }
  .dossier-heading {
    font-size: 0.82rem; text-transform: uppercase; color: var(--accent-gold);
    font-weight: 800; letter-spacing: 0.5px; margin-bottom: 6px;
  }
  
  .modal-backdrop {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85); z-index: 999;
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex !important; }
  .modal-dialog {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; max-width: 440px; width: 100%; max-height: 90vh;
    overflow-y: auto; padding: 16px;
  }
</style>
</head>
<body ontouchstart="">

  <!-- ROLLER SECTION -->
  <div class="card roller-container">
    <div class="dice-display" id="dice-result">20</div>
    <div class="dice-subtext" id="dice-summary">Tap below to roll for an action</div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" onclick="doRoll('standard')">Roll d20</button>
      <button type="button" class="btn btn-gold" onclick="doRoll('adv')">Advantage</button>
      <button type="button" class="btn btn-purple" onclick="doRoll('dis')">Disadv</button>
    </div>
    <div class="mod-strip">
      <button type="button" class="mod-btn selected" id="mod-zero" onclick="setRollMod(0, 'Flat', this)">+0 Flat</button>
      <button type="button" class="mod-btn" id="mod-force" onclick="setRollMod('force', 'Force', this)">Force</button>
      <button type="button" class="mod-btn" id="mod-finesse" onclick="setRollMod('finesse', 'Finesse', this)">Finesse</button>
      <button type="button" class="mod-btn" id="mod-focus" onclick="setRollMod('focus', 'Focus', this)">Focus</button>
    </div>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="nav-tabs">
    <button type="button" class="tab-btn active" onclick="switchNavTab('play', this)">Play Sheet</button>
    <button type="button" class="tab-btn" onclick="switchNavTab('dossier', this)">Dossier</button>
